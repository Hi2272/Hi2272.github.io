<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <title>Chemie-Editor – MathJax</title>
<link rel="stylesheet" href="style.css">
  <script src="https://Hi2272.github.io/vanillatoasts.js"></script>
  <link href="https://Hi2272.github.io/vanillatoasts.css" rel="stylesheet">


<script>
    window.MathJax = {
      loader: {
        load: ["[tex]/mhchem"]
      },
      tex: {
        packages: {
          "[+]": ["mhchem"]
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="script.js"></script>
</head>

<body style="text-align: center;">
  <h1>Chemie-Editor für MathJax</h1>

  <table>
  <tr>
    <td>n</td>
    <td>Edukt 1</td>
    <td>n</td>
    <td>Edukt 2</td>
    <td></td>
    <td>n</td>
    <td>Produkt 1</td>
    <td>n</td>
    <td>Produkt 2</td>
  </tr>
  <tr>
    <td><input id="k1" type="text" size="3"></td>
    <td><input id="f1" type="text" size="15"> +</td>

    <td><input id="k2" type="text" size="3"></td>
    <td><input id="f2" type="text" size="15"></td>

    <td>→</td>

    <td><input id="k3" type="text" size="3"></td>
    <td><input id="f3" type="text" size="15"> +</td>

    <td><input id="k4" type="text" size="3"></td>
    <td><input id="f4" type="text" size="15"></td>
  </tr>
</table>
<hr>

  <div id="pfeilauswahl">
  <h2>Pfeilart:</h2>

  <label>
    <input type="radio" name="pfeilart" value="rechts" checked>
    rechts
  </label>

  <label>
    <input type="radio" name="pfeilart" value="links">
    links
  </label>

  <label>
    <input type="radio" name="pfeilart" value="gleichgewicht">
    Gleichgewicht
  </label>

  <label>
    <input type="radio" name="pfeilart" value="gleichgewicht-links">
    Gleichgewicht links
  </label>

  <label>
    <input type="radio" name="pfeilart" value="gleichgewicht-rechts">
    Gleichgewicht rechts
  </label>
</div>
<hr>


<input id="pfeilOben" type="text" placeholder="Text über dem Pfeil" size="80">
<br>
<br>

<input id="pfeilUnten" type="text" placeholder="Text unter dem Pfeil" size="80">

<br>
<hr>

  <p>
    <button type="button" onclick="umwandeln()">MathJax-Formel erzeugen</button>
  </p>

<table>
    <tr>
      <td colspan="2"><input id="kf1" type="text" size="30" readonly></td>
      <td colspan="2"><input id="kf2" type="text" size="30" readonly></td>
      <td></td>
      <td colspan="2"><input id="kf3" type="text" size="30" readonly></td>
      <td colspan="2"><input id="kf4" type="text" size="30" readonly></td>
    </tr>
  </table>


  <p>
    <label for="o41">Lösung MathJax:</label>
    <input id="o41" type="text" size="100" readonly>
    <button type="button" onclick="copyMathJax()">Kopieren</button>
  </p>
<div id="mathjax"></div>

<button type="button" onclick="copyMathJaxAsImage()">
  Formel als Bild kopieren
</button>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>


</body>

</html>
